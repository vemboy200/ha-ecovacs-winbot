rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration does not register any custom actions.
  appropriate-polling:
    status: done
    comment: >
      Push first: HA stays connected while the robot is on and the robot pushes
      every change. getInfo is polled as a backup only, every 60 seconds while
      cleaning and every 2 minutes while idle. After 15 minutes idle HA lets go
      and stops polling, so the robot can switch itself off.
  brands:
    status: done
    comment: Ecovacs brand images from home-assistant/brands are shipped in the integration's brand/ folder.
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: exempt
    comment: >
      There are no requirements. The protocol code is bundled in winbot/ (no Home
      Assistant imports, MIT, in this repository). It has to become its own PyPI
      library before a core submission, where bundling isn't allowed.
  docs-actions:
    status: exempt
    comment: The integration does not register any custom actions.
  docs-conditions:
    status: exempt
    comment: The integration does not provide any custom conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration does not provide any custom triggers (the cleaning event is an event entity).
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup:
    status: exempt
    comment: >
      The robot switches itself off after a few minutes idle, so it's usually
      unreachable at startup. Setup succeeds and the robot shows as Off until it
      advertises again, instead of retrying setup forever.
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: The integration has no options flow.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: >
      Going off and coming back are each logged once at info level, not warning:
      the robot switching itself off after a few idle minutes is normal.
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: The robot has no authentication.
  test-coverage:
    status: done
    comment: >
      Every integration module is above 95%, except the coordinator at 93%;
      together they're at 97%. The bundled winbot/ protocol library isn't
      covered as well (its Bluetooth client is tested against the real robot)
      and needs its own tests when it becomes a PyPI library.

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: The robot is identified by its Bluetooth address, which doesn't change.
  discovery: done
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: Each config entry is one robot.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: done
    comment: >
      Signal strength is deliberately enabled: the robot moves between windows and
      Bluetooth range is the most common reason it can't be reached.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow:
    status: exempt
    comment: There is nothing to reconfigure; the robot is identified by its Bluetooth address.
  repair-issues:
    status: exempt
    comment: There are no problems the user needs to fix through a repair issue.
  stale-devices:
    status: exempt
    comment: Each config entry is one robot; removing the robot means removing the entry.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: The integration doesn't use HTTP.
  strict-typing:
    status: done
    comment: Checked with mypy --strict in CI (the Lint workflow), including the bundled winbot/ library.
